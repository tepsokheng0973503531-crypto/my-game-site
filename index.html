<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click Me Game</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-align: center;
    }

    .game {
      background: rgba(255,255,255,0.15);
      padding: 35px;
      border-radius: 25px;
      width: 85%;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .score {
      font-size: 28px;
      margin: 20px;
    }

    button {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      border: none;
      background: #ffcc00;
      color: #222;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 0 #c99f00;
    }

    button:active {
      transform: translateY(8px);
      box-shadow: none;
    }

    .reset {
      margin-top: 25px;
      width: auto;
      height: auto;
      padding: 12px 25px;
      border-radius: 12px;
      font-size: 18px;
      background: white;
      box-shadow: none;
    }

    p {
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="game">
    <h1>🎮 CLICK ME!</h1>
    <p>ចុចប៊ូតុង ដើម្បីរកពិន្ទុ</p>

    <div class="score">
      Score: <span id="score">0</span>
    </div>

    <button onclick="clickGame()">CLICK ME!</button>

    <br>

    <button class="reset" onclick="resetGame()">🔄 Reset</button>
  </div>

  <script>
    let score = 0;

    function clickGame() {
      score++;
      document.getElementById("score").textContent = score;
    }

    function resetGame() {
      score = 0;
      document.getElementById("score").textContent = score;
    }
  </script>

</body>
</html>

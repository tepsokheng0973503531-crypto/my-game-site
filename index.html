<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Click Game</title>
<style>
body{margin:0;background:#168de2;font-family:Arial;text-align:center;color:white}
.box{margin:70px auto;padding:30px;max-width:500px;background:#ffffff33;border-radius:25px}
button{border:0;border-radius:50%;width:260px;height:260px;background:#ffd21c;font-size:30px;font-weight:bold}
.reset{width:auto;height:auto;border-radius:10px;padding:12px 25px;margin-top:20px}
</style>
</head>
<body>
<div class="box">
<h1>🎮 CLICK ME!</h1>
<h2>Score: <span id="score">0</span></h2>
<button onclick="clickMe()">CLICK ME!</button><br>
<button class="reset" onclick="score=0;show()">🔄 Reset</button>
</div>

<script>
let score=0;
function clickMe(){score++;show()}
function show(){document.getElementById("score").textContent=score}
</script>
</body>
</html>
